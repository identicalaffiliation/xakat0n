name: Go Service CI

on:
  workflow_call:
    inputs:
      service:
        description: Go module directory
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ${{ inputs.service }}/go.mod
          cache-dependency-path: ${{ inputs.service }}/go.sum

      - name: Set up Task
        uses: go-task/setup-task@v1

      - name: Run checks
        run: task ${{ inputs.service }}:ci

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ${{ inputs.service }}/go.mod
          cache-dependency-path: ${{ inputs.service }}/go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11
          working-directory: ${{ inputs.service }}
