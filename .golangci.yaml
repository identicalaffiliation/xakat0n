version: "2"

run:
  timeout: 5m
  relative-path-mode: gomod
  modules-download-mode: readonly
  tests: true

linters:
  default: standard
  enable:
    - bodyclose
    - containedctx
    - errorlint
    - errname
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - unconvert

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
