version: "3"

tasks:
  up:
    desc: Build and start the entire application; backend waits for migrations
    cmds:
      - docker compose up --build --detach

  down:
    desc: Stop all services
    cmds:
      - docker compose down

  logs:
    desc: Follow logs from all services
    cmds:
      - docker compose logs --follow

  backend:modules:
    desc: Check that backend module files are up to date
    dir: backend
    cmds:
      - go mod tidy -diff

  backend:fmt:
    desc: Format backend Go source files
    dir: backend
    cmds:
      - golangci-lint fmt

  backend:lint:
    desc: Run backend linters
    dir: backend
    cmds:
      - golangci-lint run

  backend:vet:
    desc: Run go vet for the backend
    dir: backend
    cmds:
      - go vet ./...

  backend:test:
    desc: Run backend tests with the race detector
    dir: backend
    cmds:
      - go test -race ./...

  backend:build:
    desc: Build all backend binaries into bin
    dir: backend
    cmds:
      - go build -o ../bin/ ./cmd/...

  backend:check:
    desc: Run all backend checks
    deps: [backend:vet, backend:test, backend:build]

  backend:ci:
    desc: Run backend CI checks
    cmds:
      - task: backend:modules
      - task: backend:check

  postgres:up:
    desc: Start PostgreSQL and wait until it is ready
    cmds:
      - docker compose up --detach --wait postgres

  postgres:down:
    desc: Stop PostgreSQL
    cmds:
      - docker compose down
  postgres:logs:
    desc: Follow PostgreSQL logs
    cmds:
      - docker compose logs --follow postgres

  backend:up:
    desc: Start backend service
    cmds:
      - docker compose up --build -d backend
  backend:down:
    desc: Stop backend service
    cmds:
      - docker compose down backend
  backend:logs:
    desc: Follow backend logs
    cmds:
      - docker compose logs --follow backend

  frontend:up:
    desc: Build and start frontend service
    cmds:
      - docker compose up --build --detach frontend
  frontend:down:
    desc: Stop frontend service
    cmds:
      - docker compose stop frontend
  frontend:logs:
    desc: Follow frontend logs
    cmds:
      - docker compose logs --follow frontend

  migrator:up:
    desc: migrations up
    cmds:
      - docker compose build migrator
      - docker compose run --rm migrator
  migrator:down:
    desc: migrations down
    cmds:
      - docker compose build migrator
      - docker compose run --rm migrator -config config.yml -command down
  migrator:reset:
    desc: migrations reset
    cmds:
      - docker compose build migrator
      - docker compose run --rm migrator -config config.yml -command reset
  migrator:logs:
    desc: Follow migrator logs
    cmds:
      - docker compose logs --follow migrator

  migrator:modules:
    desc: Check that migrator module files are up to date
    dir: migrator
    cmds:
      - go mod tidy -diff

  migrator:fmt:
    desc: Format migrator Go source files
    dir: migrator
    cmds:
      - golangci-lint fmt

  migrator:lint:
    desc: Run migrator linters
    dir: migrator
    cmds:
      - golangci-lint run

  migrator:vet:
    desc: Run go vet for the migrator
    dir: migrator
    cmds:
      - go vet ./...

  migrator:test:
    desc: Run migrator tests with the race detector
    dir: migrator
    cmds:
      - go test -race ./...

  migrator:build:
    desc: Build all migrator binaries into bin
    dir: migrator
    cmds:
      - go build -o ../bin/ ./cmd/...

  migrator:check:
    desc: Run all migrator checks
    deps: [migrator:vet, migrator:test, migrator:build]

  migrator:ci:
    desc: Run migrator CI checks
    cmds:
      - task: migrator:modules
      - task: migrator:check

  metrics:up:
    desc: Start VictoriaMetrics and Grafana
    cmds:
      - docker compose up --detach victoriametrics grafana

  metrics:down:
    desc: Stop VictoriaMetrics and Grafana
    cmds:
      - docker compose down victoriametrics grafana

  metrics:logs:
    desc: Follow VictoriaMetrics and Grafana logs
    cmds:
      - docker compose logs --follow victoriametrics grafana

  clean:
    cmds:
      - docker compose down -v
