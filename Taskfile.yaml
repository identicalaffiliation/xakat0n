version: "3"

tasks:
  backend:modules:
    desc: Check that backend module files are up to date
    dir: backend
    cmds:
      - go mod tidy
      - git diff --exit-code -- go.mod go.sum

  backend:fmt:
    desc: Format backend Go source files
    dir: backend
    cmds:
      - golangci-lint fmt

  backend:lint:
    desc: Run backend linters
    dir: backend
    cmds:
      - golangci-lint run

  backend:vet:
    desc: Run go vet for the backend
    dir: backend
    cmds:
      - go vet ./...

  backend:test:
    desc: Run backend tests with the race detector
    dir: backend
    cmds:
      - go test -race ./...

  backend:build:
    desc: Build all backend binaries into bin
    dir: backend
    cmds:
      - go build -o ../bin/ ./cmd/...

  backend:check:
    desc: Run all backend checks
    deps: [backend:vet, backend:test, backend:build]

  backend:ci:
    desc: Run backend CI checks
    cmds:
      - task: backend:modules
      - task: backend:check

  db:up:
    desc: Start PostgreSQL and wait until it is ready
    cmds:
      - docker compose up --detach --wait postgres

  db:down:
    desc: Stop PostgreSQL
    cmds:
      - docker compose down
  db:logs:
    desc: Follow PostgreSQL logs
    cmds:
      - docker compose logs --follow postgres

  backend:up:
    desc: Start backend service
    cmds:
      - docker compose up --build -d backend
  backend:down:
    desc: Stop backend service
    cmds:
      - docker compose down backend

  migrator:up:
    desc: migrations up
    cmds:
      - docker compose build migrator
      - docker compose run --rm migrator
  migrator:down:
    desc: migrations down
    cmds:
      - docker compose build migrator
      - docker compose run --rm migrator -config config.yml -command down
  migrator:reset:
    desc: migrations reset
    cmds:
      - docker compose build migrator
      - docker compose run --rm migrator -config config.yml -command reset

  migrator:modules:
    desc: Check that migrator module files are up to date
    dir: migrator
    cmds:
      - go mod tidy
      - git diff --exit-code -- go.mod go.sum

  migrator:fmt:
    desc: Format migrator Go source files
    dir: migrator
    cmds:
      - golangci-lint fmt

  migrator:lint:
    desc: Run migrator linters
    dir: migrator
    cmds:
      - golangci-lint run

  migrator:vet:
    desc: Run go vet for the migrator
    dir: migrator
    cmds:
      - go vet ./...

  migrator:test:
    desc: Run migrator tests with the race detector
    dir: migrator
    cmds:
      - go test -race ./...

  migrator:build:
    desc: Build all migrator binaries into bin
    dir: migrator
    cmds:
      - go build -o ../bin/ ./cmd/...

  migrator:check:
    desc: Run all migrator checks
    deps: [migrator:vet, migrator:test, migrator:build]

  migrator:ci:
    desc: Run migrator CI checks
    cmds:
      - task: migrator:modules
      - task: migrator:check

  clean:
    cmds:
      - docker compose down -v
