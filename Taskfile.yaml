version: "3"

tasks:
  backend:modules:
    desc: Check that backend module files are up to date
    dir: backend
    cmds:
      - go mod tidy
      - git diff --exit-code -- go.mod go.sum

  backend:fmt:
    desc: Format backend Go source files
    dir: backend
    cmds:
      - golangci-lint fmt

  backend:lint:
    desc: Run backend linters
    dir: backend
    cmds:
      - golangci-lint run

  backend:vet:
    desc: Run go vet for the backend
    dir: backend
    cmds:
      - go vet ./...

  backend:test:
    desc: Run backend tests with the race detector
    dir: backend
    cmds:
      - go test -race ./...

  backend:build:
    desc: Build all backend packages
    dir: backend
    cmds:
      - go build ./...

  backend:check:
    desc: Run all backend checks
    deps: [backend:vet, backend:test, backend:build]

  backend:ci:
    desc: Run backend CI checks
    cmds:
      - task: backend:modules
      - task: backend:check

  db:up:
    desc: Start PostgreSQL and wait until it is ready
    cmds:
      - docker compose up --detach --wait postgres

  db:down:
    desc: Stop PostgreSQL
    cmds:
      - docker compose down

  db:logs:
    desc: Follow PostgreSQL logs
    cmds:
      - docker compose logs --follow postgres
