openapi: 3.0.3
info:
  title: Авито Очередь API
  version: "1.0.0"
  description: >
    API MVP сервиса пользовательской очереди (Кейс 2, Avito Start).
    Отвечает только за очередь и временное право на покупку дефицитных
    товаров. Оформление заказа, оплата и полноценная авторизация — вне
    скоупа; в MVP это заглушки (см. architecture.md, "Зона ответственности").

servers:
  - url: http://localhost:8080/api/v1

security:
  - UserIdAuth: []

paths:
  /auth/login:
    post:
      summary: Упрощённый вход по имени пользователя
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username:
                  type: string
                  example: "hunter_42"
      responses:
        '200':
          description: Пользователь найден или создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /items:
    get:
      summary: Список товаров каталога
      responses:
        '200':
          description: Список товаров
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Item'
              example:
                - item_id: "a1b2c3d4-0000-0000-0000-000000000001"
                  title: "Кроссовки, лимитированная коллекция"
                  description: "Эксклюзивная модель, ограниченный тираж"
                  price: 24990
                  category: "shoes"
                  is_limited: true
                  stock: 1
                  sold_out: false
                - item_id: "a1b2c3d4-0000-0000-0000-000000000002"
                  title: "Обычные кроссовки"
                  description: "В наличии на складе"
                  price: 5990
                  category: "shoes"
                  is_limited: false
                  stock: 0
                  sold_out: false

  /items/{itemId}:
    get:
      summary: Карточка товара
      parameters:
        - $ref: '#/components/parameters/ItemId'
      responses:
        '200':
          description: Товар найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '404':
          description: Товар не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /items/{itemId}/similar:
    get:
      summary: Похожие лоты по той же категории (сценарии C1, C2)
      parameters:
        - $ref: '#/components/parameters/ItemId'
      responses:
        '200':
          description: Похожие товары (подбор по совпадению category)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Item'

  /items/{itemId}/queue:
    post:
      summary: Встать в очередь / получить право (сценарии A2, A3, D2, D5, D6)
      description: >
        Идемпотентно относительно активных заявок: если у пользователя уже
        есть тикет в статусе QUEUED/OFFERED по этому товару — возвращается
        он же, новый не создаётся (частичный уникальный индекс, см.
        architecture.md). Если существующий тикет в терминальном статусе
        (CANCELLED/EXPIRED/SOLD_OUT/COMPLETED) — создаётся новый тикет
        с текущим временем, естественно попадающий в конец очереди (D6).
      parameters:
        - $ref: '#/components/parameters/ItemId'
      responses:
        '200':
          description: Тикет создан или уже существовал
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '409':
          description: Товар не дефицитный — очередь не применима
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /items/{itemId}/queue/me:
    get:
      summary: >
        Опросить статус своего тикета (запускает advanceQueue,
        сценарии B1, B2, C1)
      parameters:
        - $ref: '#/components/parameters/ItemId'
      responses:
        '200':
          description: Текущий статус тикета
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '404':
          description: У пользователя нет тикета по этому товару
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Выйти из очереди (сценарий D1)
      description: >
        Работает из статусов QUEUED и OFFERED; при отмене из OFFERED
        слот освобождается немедленно, не по таймауту.
      parameters:
        - $ref: '#/components/parameters/ItemId'
      responses:
        '200':
          description: Тикет отменён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '404':
          description: Активного тикета нет
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /items/{itemId}/checkout:
    post:
      summary: >
        Перейти к оформлению — заглушка (сценарии B1, D3, D4)
      description: >
        Реальные заказ и оплата вне скоупа кейса; здесь только проверка
        права и пометка COMPLETED. Право проверяется по (user_id, item_id)
        на сервере — ticket_id из запроса не принимается, поэтому передать
        или переиспользовать чужое право технически невозможно.
      parameters:
        - $ref: '#/components/parameters/ItemId'
      responses:
        '200':
          description: Право использовано, оформление (заглушка) пройдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '403':
          description: >
            Нет активного непросроченного права на этот товар —
            обход очереди, чужое или уже использованное право (D3/D4)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    UserIdAuth:
      type: apiKey
      in: header
      name: X-User-Id
      description: >
        Упрощённая идентификация вместо полноценной авторизации
        (вне скоупа кейса). Значение выдаётся в POST /auth/login.
        Осознанно заголовок, а не cookie: identity хранится в JS-состоянии
        конкретной вкладки (через fetch/axios-interceptor, без ручного
        проброса на каждый запрос), а не в браузере целиком. Это важно
        конкретно для демо-плана команды: несколько окон инкогнито,
        открытых одновременно, делят одну и ту же сессию кук между собой
        (изолируется только при закрытии всех окон инкогнито) — с cookie-
        подходом все "разные" пользователи в демо оказались бы одним и тем
        же. Восстановление сессии (E1) при этом не страдает: повторный
        ввод username находит тот же user_id на сервере.

  parameters:
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    User:
      type: object
      required: [user_id, username]
      properties:
        user_id:
          type: string
          format: uuid
        username:
          type: string

    Item:
      type: object
      required: [item_id, title, price, is_limited]
      properties:
        item_id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        price:
          type: number
          format: float
        category:
          type: string
        is_limited:
          type: boolean
        stock:
          type: integer
          description: Актуально только при is_limited = true
        sold_out:
          type: boolean
          description: true, если число COMPLETED-тикетов сравнялось со stock
      example:
        item_id: "a1b2c3d4-0000-0000-0000-000000000001"
        title: "Кроссовки, лимитированная коллекция"
        description: "Эксклюзивная модель, ограниченный тираж"
        price: 24990
        category: "shoes"
        is_limited: true
        stock: 1
        sold_out: false

    Ticket:
      type: object
      required: [ticket_id, item_id, status]
      properties:
        ticket_id:
          type: string
          format: uuid
        item_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [QUEUED, OFFERED, EXPIRED, COMPLETED, SOLD_OUT, CANCELLED]
        position:
          type: integer
          nullable: true
          description: >
            Место среди тех, кто ещё в QUEUED (1 = следующий на очереди).
            Заполняется только при status = QUEUED. Может уменьшиться
            сразу на несколько единиц за один опрос, если освободилось
            несколько мест одновременно.
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: Заполняется только при status = OFFERED
        created_at:
          type: string
          format: date-time
      example:
        ticket_id: "f1e2d3c4-0000-0000-0000-000000000001"
        item_id: "a1b2c3d4-0000-0000-0000-000000000001"
        status: "OFFERED"
        position: null
        expires_at: "2026-08-03T12:05:00Z"
        created_at: "2026-08-03T12:00:00Z"

    Error:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          example: "no_active_right"
        message:
          type: string
          example: "У вас нет активного права на покупку этого товара"
