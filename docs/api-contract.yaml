openapi: 3.0.3
info:
  title: Авито Очередь API
  version: "1.0.0"
  description: >
    Сервис пользовательской очереди для дефицитных товаров.

    Отвечает на один вопрос: кто прямо сейчас имеет право купить
    конкретный дефицитный товар и до какого момента это право действует.

    Продуктовое обещание, из которого выведён весь контракт:
    дождались очереди — получили окно в N минут; успели оплатить
    внутри окна — товар ваш. Окно выставляется один раз, в момент
    выдачи права, и не продлевается ничем: ни переходом к оформлению,
    ни попытками оплаты.

    Вне скоупа: регистрация и авторизация, оформление заказа,
    проведение оплаты, списание стоков. В MVP это заглушки.
    Единственный входящий сигнал извне — факт подтверждения оплаты.

    Статусы заявки: QUEUED (в очереди), OFFERED (право выдано),
    CHECKOUT (ушёл оформлять), PURCHASED (куплено), EXPIRED
    (окно истекло), CANCELLED (отказ), SOLD_OUT (раскуплено).
    Единицу товара занимают OFFERED, CHECKOUT и PURCHASED.

servers:
  - url: http://localhost:8080/api/v1
    description: Локальный запуск через docker compose

security:
  - SessionTokenAuth: []

tags:
  - name: auth
    description: Упрощённая идентификация вместо полноценной авторизации
  - name: items
    description: Каталог товаров и подбор похожих лотов
  - name: queue
    description: Очередь и временное право на покупку
  - name: checkout
    description: Передача управления в оформление и приём исхода оплаты

paths:
  /auth/login:
    post:
      tags: [auth]
      summary: Вход по имени пользователя
      description: >
        Если пользователя с таким именем нет — создаётся. Пароля нет:
        полноценная авторизация вне скоупа. Возвращает session_token,
        который клиент хранит в sessionStorage и передаёт
        в заголовке X-Session-Token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username:
                  type: string
                  minLength: 1
                  maxLength: 64
                  example: "hunter_42"
      responses:
        '200':
          description: Пользователь найден или создан, сессия выдана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'

  /items:
    get:
      tags: [items]
      summary: Каталог товаров
      responses:
        '200':
          description: Список товаров
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Item'
              example:
                - item_id: "a1b2c3d4-0000-0000-0000-000000000001"
                  title: "Кроссовки, лимитированная коллекция"
                  description: "Эксклюзивная модель, ограниченный тираж"
                  price: 24990
                  category: "shoes"
                  is_limited: true
                  stock: 1
                  sold_out: false
                - item_id: "a1b2c3d4-0000-0000-0000-000000000002"
                  title: "Обычные кроссовки"
                  description: "В наличии на складе"
                  price: 5990
                  category: "shoes"
                  is_limited: false
                  stock: null
                  sold_out: false
        '401':
          $ref: '#/components/responses/Unauthorized'

  /items/{itemId}:
    get:
      tags: [items]
      summary: Карточка товара
      parameters:
        - $ref: '#/components/parameters/ItemId'
      responses:
        '200':
          description: Товар найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ItemNotFound'

  /items/{itemId}/similar:
    get:
      tags: [items]
      summary: Похожие лоты у других продавцов
      description: >
        Удерживает пользователя на платформе, когда товар не достался.
        Показывается в состояниях, где на руках у пользователя ничего
        нет: SOLD_OUT, QUEUED, EXPIRED, CANCELLED.

        Подбор по совпадению category. ИИ-подбор через эмбеддинги —
        опциональное усиление с обязательным fallback на этот же
        механизм, чтобы недоступность внешней сети не ломала сценарий.
      parameters:
        - $ref: '#/components/parameters/ItemId'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 6
            minimum: 1
            maximum: 20
      responses:
        '200':
          description: Похожие товары, отсортированы по релевантности
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Item'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ItemNotFound'

  /items/{itemId}/queue:
    post:
      tags: [queue]
      summary: Войти в очередь на покупку
      description: >
        Единая точка входа. Вызывается штатной кнопкой «Купить
        с доставкой» на карточке лимитированного товара — отдельной
        кнопки «встать в очередь» в интерфейсе нет.

        Возможны три исхода, и все три приходят в ответе на этот вызов:
        место нашлось — тикет сразу в OFFERED с выставленным окном;
        мест нет — тикет в QUEUED с позицией; товар распродан — 409.

        Число свободных мест не публикуется в карточке товара
        намеренно: оно меняется между отрисовкой страницы и кликом,
        и показанное заранее обещание нельзя было бы сдержать.
        Достоверно состояние известно только здесь.

        Идемпотентен относительно активных заявок: при существующем
        тикете в QUEUED, OFFERED или CHECKOUT возвращается он же.
        При терминальном тикете (CANCELLED, EXPIRED, PURCHASED,
        SOLD_OUT) создаётся новый — он встаёт в конец очереди
        по времени создания. Лимита «одна единица в руки» нет:
        уже купивший может встать снова, но без привилегий.

        Перед решением о статусе очередь продвигается: освободившееся
        место сначала уходит голове очереди и только потом
        рассматривается новая заявка. Иначе отменивший своё право
        мог бы мгновенным повторным кликом забрать слот вперёд тех,
        кто ждал дольше.
      parameters:
        - $ref: '#/components/parameters/ItemId'
      responses:
        '200':
          description: Тикет создан или уже существовал
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
              examples:
                offered:
                  summary: Место нашлось, право выдано сразу
                  value:
                    ticket_id: "f1e2d3c4-0000-0000-0000-000000000001"
                    item_id: "a1b2c3d4-0000-0000-0000-000000000001"
                    status: "OFFERED"
                    position: null
                    next_slot_free_in_seconds: null
                    expires_in_seconds: 90
                    expires_at: "2026-08-04T12:06:30Z"
                    created_at: "2026-08-04T12:05:00Z"
                    server_time: "2026-08-04T12:05:00Z"
                queued:
                  summary: Мест нет, встал в очередь
                  value:
                    ticket_id: "f1e2d3c4-0000-0000-0000-000000000002"
                    item_id: "a1b2c3d4-0000-0000-0000-000000000001"
                    status: "QUEUED"
                    position: 3
                    next_slot_free_in_seconds: 42
                    expires_in_seconds: null
                    expires_at: null
                    created_at: "2026-08-04T12:05:00Z"
                    server_time: "2026-08-04T12:05:00Z"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ItemNotFound'
        '409':
          description: >
            Очередь неприменима: товар не дефицитный
            (error: queue_not_applicable) либо весь сток уже выкуплен
            (error: item_sold_out)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /items/{itemId}/queue/me:
    get:
      tags: [queue]
      summary: Статус своей заявки
      description: >
        Основной polling-эндпоинт, опрашивается раз в 2–3 секунды.
        Он же служит триггером продвижения очереди: перед ответом
        система переводит просроченные права в EXPIRED и выдаёт
        освободившиеся места следующим в очереди. Отдельного
        фонового процесса в MVP нет.

        Заявка ищется по паре (item_id, user_id), где user_id взят
        из серверной сессии — поэтому статус переживает закрытие
        вкладки и разрыв соединения, и восстановление не требует
        ни навигации, ни списка заявок: достаточно снова открыть
        карточку товара.

        Клиенту следует останавливать опрос при терминальном статусе
        и приостанавливать при скрытой вкладке.
      parameters:
        - $ref: '#/components/parameters/ItemId'
      responses:
        '200':
          description: Текущий статус заявки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/TicketNotFound'

    delete:
      tags: [queue]
      summary: Отказаться от покупки
      description: >
        Работает одинаково из всех трёх активных статусов: QUEUED,
        OFFERED и CHECKOUT. «Выйти из очереди» и «отказаться
        от оплаты» — один и тот же переход в CANCELLED.

        Единица товара освобождается ровно двумя способами:
        истечением окна или этим вызовом. При отказе из OFFERED
        или CHECKOUT слот уходит следующему в очереди в рамках
        этого же запроса, а не по таймауту и не на чужом опросе.

        Действие необратимо: вернуться на своё место в очереди
        нельзя, повторный вход создаёт новую заявку в конце.
      parameters:
        - $ref: '#/components/parameters/ItemId'
      responses:
        '200':
          description: Заявка отменена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/TicketNotFound'

  /items/{itemId}/checkout:
    post:
      tags: [checkout]
      summary: Перейти к оформлению
      description: >
        Рубеж защиты и передача управления. Заказ и оплата вне скоупа:
        здесь только проверка права и перевод заявки в CHECKOUT.

        Право проверяется по паре (user_id, item_id), где user_id взят
        из серверной сессии. Ни ticket_id, ни user_id из запроса
        не принимаются — воспользоваться чужим правом клиент не может.
        Проверка сверяет время напрямую (expires_at > now()), а не
        читает статус, который мог устареть, если очередь давно
        никто не опрашивал.

        Окно при этом не перезапускается: expires_at остаётся тем же,
        что был выставлен при выдаче права. Иначе остаток права
        конвертировался бы в полное новое окно, и нажимать кнопку
        было бы рационально немедленно, ничего не решая.

        Для не дефицитного товара право не требуется: запрос проходит,
        заявка не создаётся.
      parameters:
        - $ref: '#/components/parameters/ItemId'
      responses:
        '200':
          description: Оформление начато
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutStarted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >
            Нет активного непросроченного права на этот товар: попытка
            обойти очередь, воспользоваться чужим правом либо уже
            израсходованным или истёкшим (error: no_active_right)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/ItemNotFound'

  /items/{itemId}/payment/callback:
    post:
      tags: [checkout]
      summary: Уведомление об исходе оплаты
      description: >
        Единственный входящий сигнал извне. Оплату мы не проводим
        и не наблюдаем, но обязаны знать факт подтверждения — иначе
        занятая единица товара висела бы до конца окна без причины.

        Форма — push: платёжный сервис вызывает нас, а не мы опрашиваем
        его. Нам нужен факт, а не состояние: «этот пользователь оплатил
        этот товар» происходит один раз и дальше не меняется. Опрос
        добавил бы синхронную зависимость и нагрузку, пропорциональную
        числу наблюдателей.

        Запрашивается только факт: ни суммы, ни способа оплаты,
        ни причин отказа — это данные платёжного сервиса.

        paid — заявка переходит в PURCHASED, единица считается
        проданной. Применяется только к заявке в статусе CHECKOUT
        с непросроченным окном.

        failed — статус не меняется. Заявка остаётся в CHECKOUT,
        увеличивается счётчик попыток, пользователь пробует снова
        внутри своего окна. Платёж не проходит чаще всего не по вине
        покупателя — лимит карты, 3-D Secure, сбой эквайринга — и
        отбирать товар у человека, отстоявшего очередь, за отказ его
        банка нельзя. Число попыток не ограничено, ограничена частота.

        Повторные уведомления о том же платеже безопасны: переход
        применяется только к статусу CHECKOUT, поэтому дубль ничего
        не найдёт.

        В MVP вызывающая сторона — кнопка страницы-заглушки
        оформления. В проде здесь была бы service-to-service
        авторизация, а user_id приходил бы в теле запроса.
      parameters:
        - $ref: '#/components/parameters/ItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [result]
              properties:
                result:
                  type: string
                  enum: [paid, failed]
      responses:
        '200':
          description: >
            Исход зафиксирован. При paid заявка в PURCHASED;
            при failed — по-прежнему в CHECKOUT с прежним остатком
            окна
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/TicketNotFound'
        '409':
          description: >
            Заявка не в статусе CHECKOUT либо окно уже истекло:
            подтверждение опоздало, единица отдана следующему.
            Возврат средств — на стороне платёжного сервиса
            (error: checkout_result_too_late)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: >
            Попытки чаще одной в 2 секунды
            (error: payment_retry_too_soon)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    SessionTokenAuth:
      type: apiKey
      in: header
      name: X-Session-Token
      description: >
        Токен — 32 случайных байта, выдаётся в POST /auth/login
        и резолвится сервером в user_id.

        Клиент не передаёт user_id ни в каком виде: право на покупку
        обязано быть персональным и непередаваемым, а принимаемый
        от клиента идентификатор пользователя обнулил бы эту гарантию.

        Заголовок, а не cookie: несколько одновременно открытых окон
        инкогнито делят одну сессию кук между собой, и демонстрация
        с несколькими параллельными покупателями превратилась бы
        в демонстрацию одного. Клиенту следует хранить токен
        в sessionStorage — он изолирован между вкладками, в отличие
        от localStorage, и переживает перезагрузку страницы,
        в отличие от переменной в памяти.

  parameters:
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Некорректное тело запроса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Заголовок X-Session-Token отсутствует или недействителен
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ItemNotFound:
      description: Товар не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TicketNotFound:
      description: У пользователя нет заявки по этому товару
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Session:
      type: object
      required: [user_id, username, session_token]
      properties:
        user_id:
          type: string
          format: uuid
          description: Для отображения. В запросах не используется.
        username:
          type: string
        session_token:
          type: string
          description: Передаётся в заголовке X-Session-Token
      example:
        user_id: "b7c1d2e3-0000-0000-0000-000000000001"
        username: "hunter_42"
        session_token: "9pQ3xK7mWv2sT8bH1nR4jL6cY0dF5aZe"

    Item:
      type: object
      required: [item_id, title, price, is_limited, sold_out]
      properties:
        item_id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        price:
          type: number
          format: float
        category:
          type: string
          description: Основа подбора похожих лотов
        is_limited:
          type: boolean
          description: >
            Дефицитный ли товар. Порога по остатку нет: помечен
            лимитированным — покупка идёт через очередь при любом
            остатке. В интерфейсе отражается лычкой на карточке.
        stock:
          type: integer
          nullable: true
          description: >
            Ёмкость, заполняется только при is_limited = true.
            Никогда не декрементируется: занятость выводится
            из заявок. Владельцем резерва должен быть кто-то один —
            либо очередь, либо сервис стоков; в MVP это очередь.
        sold_out:
          type: boolean
          description: >
            Число выкупленных единиц сравнялось со stock. Считается
            только по PURCHASED: пока чьё-то право ещё действует
            и может завершиться покупкой или истечь, объявлять товар
            распроданным для остальных нельзя.
      example:
        item_id: "a1b2c3d4-0000-0000-0000-000000000001"
        title: "Кроссовки, лимитированная коллекция"
        description: "Эксклюзивная модель, ограниченный тираж"
        price: 24990
        category: "shoes"
        is_limited: true
        stock: 1
        sold_out: false

    Ticket:
      type: object
      description: >
        Заявка пользователя на покупку конкретного дефицитного товара.
        Одна активная заявка на пару (пользователь, товар); на разные
        товары ограничений нет.
      required: [ticket_id, item_id, status, created_at, server_time]
      properties:
        ticket_id:
          type: string
          format: uuid
        item_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - QUEUED
            - OFFERED
            - CHECKOUT
            - PURCHASED
            - EXPIRED
            - SOLD_OUT
            - CANCELLED
        position:
          type: integer
          nullable: true
          description: >
            Место среди тех, кто ещё в QUEUED; 1 — следующий на
            очереди. Только при status = QUEUED. Держатели OFFERED
            и CHECKOUT не считаются: они ждут не очереди, а своего
            таймера. Значение может уменьшиться сразу на несколько
            единиц, если освободилось несколько мест одновременно.
        next_slot_free_in_seconds:
          type: integer
          nullable: true
          description: >
            Верхняя граница ожидания ближайшего освобождения места:
            минимальный оставшийся таймер среди активных прав
            по товару. Не прогноз покупки, а гарантия «не позже чем» —
            место освободится либо раньше, если человек впереди
            купит или откажется, либо ровно тогда. Только при
            status = QUEUED.
        expires_in_seconds:
          type: integer
          nullable: true
          description: >
            Остаток окна. Заполняется при OFFERED и при CHECKOUT —
            это один и тот же счётчик, он не сбрасывается при переходе
            к оформлению. Клиенту следует отсчитывать таймер от этого
            числа, а не от разницы expires_at и локальных часов:
            расхождение часов браузера и сервера исказило бы отсчёт.
            При переходе OFFERED → CHECKOUT счётчик в интерфейсе
            обязан визуально продолжиться, а не перерисоваться.
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: >
            Абсолютный дедлайн окна, единый для OFFERED и CHECKOUT.
            Выставляется один раз при выдаче права. Для отображения
            и отладки; для отсчёта использовать expires_in_seconds.
        created_at:
          type: string
          format: date-time
          description: Время входа в очередь. Определяет позицию (FIFO).
        server_time:
          type: string
          format: date-time
          description: Время сервера на момент ответа
      example:
        ticket_id: "f1e2d3c4-0000-0000-0000-000000000001"
        item_id: "a1b2c3d4-0000-0000-0000-000000000001"
        status: "OFFERED"
        position: null
        next_slot_free_in_seconds: null
        expires_in_seconds: 47
        expires_at: "2026-08-04T12:05:00Z"
        created_at: "2026-08-04T12:00:00Z"
        server_time: "2026-08-04T12:04:13Z"

    CheckoutStarted:
      type: object
      required: [queue_applied]
      properties:
        queue_applied:
          type: boolean
          description: >
            false для не дефицитного товара: очередь не применялась,
            право не требовалось, заявка не создавалась
        ticket:
          allOf:
            - $ref: '#/components/schemas/Ticket'
          nullable: true
          description: Заявка в статусе CHECKOUT; null при queue_applied = false
      example:
        queue_applied: true
        ticket:
          ticket_id: "f1e2d3c4-0000-0000-0000-000000000001"
          item_id: "a1b2c3d4-0000-0000-0000-000000000001"
          status: "CHECKOUT"
          position: null
          next_slot_free_in_seconds: null
          expires_in_seconds: 42
          expires_at: "2026-08-04T12:05:00Z"
          created_at: "2026-08-04T12:00:00Z"
          server_time: "2026-08-04T12:04:18Z"

    Error:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: Машиночитаемый код
          enum:
            - bad_request
            - unauthorized
            - item_not_found
            - ticket_not_found
            - no_active_right
            - queue_not_applicable
            - item_sold_out
            - checkout_result_too_late
            - payment_retry_too_soon
        message:
          type: string
          description: Человекочитаемое пояснение, пригодное для показа пользователю
      example:
        error: "no_active_right"
        message: "У вас нет активного права на покупку этого товара"
